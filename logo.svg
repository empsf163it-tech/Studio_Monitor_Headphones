  <defs>
    <!-- Coral Red Soundwave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b55"/>
      <stop offset="100%" stop-color="#ff3b2b"/>
    </linearGradient>

    <!-- Headphone Body Teal Gradient -->
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d58"/>
      <stop offset="50%" stop-color="#0e363e"/>
      <stop offset="100%" stop-color="#082228"/>
    </linearGradient>

    <!-- Sleek Neon Light Mode for Dark Header -->
